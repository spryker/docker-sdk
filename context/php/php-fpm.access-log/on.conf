; PHP_FPM_ACCESS_LOG=on: the access log is enabled
[worker]
access.log = ${PHP_FPM_ACCESS_LOG_PATH}
access.format = '{"log_type":"fpm_access","time":"%{%Y-%m-%dT%H:%M:%S%z}T","pool":"%n","pid":%p,"method":"%m","status":%s,"duration_ms":%{mili}d,"cpu_pct":%C,"uri":"%{REQUEST_URI}e"}'
; peak memory field toggle: PHP_FPM_ACCESS_LOG_MEMORY=off (default) or on
include = "/usr/local/etc/php-fpm.access-log/memory-${PHP_FPM_ACCESS_LOG_MEMORY}.conf"
