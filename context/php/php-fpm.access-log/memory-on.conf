; PHP_FPM_ACCESS_LOG_MEMORY=on: the access log format with the peak memory allocated by PHP, in bytes
[worker]
access.format = '{"log_type":"fpm_access","time":"%{%Y-%m-%dT%H:%M:%S%z}T","pool":"%n","pid":%p,"method":"%m","status":%s,"duration_ms":%{mili}d,"cpu_pct":%C,"mem_peak_bytes":%{bytes}M,"uri":"%{REQUEST_URI}e"}'
